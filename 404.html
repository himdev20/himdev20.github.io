.edu-main .inst { font-size: clamp(1.4rem, 2.6vw, 1.9rem); line-height: 1.15; letter-spacing: -.035em; margin: 1.1rem 0 .4rem; }
.edu-main .deg { color: var(--text-2); }
.edu-stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 1rem 2.8rem; margin-top: 2rem; padding-top: 1.6rem; border-top: 1px solid var(--stroke); }
.edu-stats dt { font-size: .82rem; color: var(--text-3); }
.edu-stats dd { margin: .2rem 0 0; font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: -.02em; }
.edu-side { grid-column: span 2; display: grid; gap: 1rem; }
.edu-side .tile { padding: 1.4rem 1.5rem; min-height: 0; }
.edu-side h3 { font-size: 1rem; letter-spacing: -.02em; margin-top: .6rem; }
.edu-side .note { margin-top: .25rem; }
.honours { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.honour { padding: 1.5rem 1.6rem; }
.honour .big { font-family: var(--display); font-weight: 600; font-size: clamp(1.9rem, 3.6vw, 2.6rem); letter-spacing: -.05em; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.honour p { color: var(--text-2); font-size: .93rem; margin-top: .6rem; }

/* ---------- Skills ---------- */
.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.skill { padding: 1.6rem 1.7rem; }
.skill h3 { font-size: 1.05rem; letter-spacing: -.02em; margin-bottom: 1rem; }
.skill.wide { grid-column: span 3; display: grid; grid-template-columns: 12rem 1fr; gap: 1.5rem; }
.skill.wide h3 { margin: 0; padding-top: .35rem; }
.course-groups { display: grid; gap: 1.1rem; }
.course-groups h4 { margin: 0 0 .55rem; font-size: .82rem; font-weight: 600; color: var(--text-3); }

/* Marquee of interests */
.marquee { overflow: hidden; border-block: 1px solid var(--stroke); padding: 1.3rem 0; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.marquee-track { display: flex; gap: 3rem; width: max-content; }
.marquee span { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 500; letter-spacing: -.04em; color: var(--text-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 3rem; }
.marquee span::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); }
@media (prefers-reduced-motion: no-preference) {
  .marquee-track { animation: marquee 40s linear infinite; }
  @keyframes marquee { to { transform: translateX(-50%); } }
}

/* ---------- Contact ---------- */
.contact { padding: clamp(2.5rem, 6vw, 5rem); border-radius: 36px; text-align: center; }
.contact::after {
  content: ""; position: absolute; left: 50%; top: -60%; width: 70%; height: 120%; transform: translateX(-50%); z-index: -1;
  background: radial-gradient(ellipse at center, rgba(139,108,255,.35), transparent 60%); filter: blur(20px);
}
.contact h2 { font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: .98; letter-spacing: -.055em; max-width: 14ch; margin: 1.3rem auto 1.2rem; }
.contact p { color: var(--text-2); max-width: 32rem; margin: 0 auto; }
.mail { display: inline-block; margin-top: 2.2rem; font-family: var(--display); font-size: clamp(1.1rem, 3vw, 1.8rem); font-weight: 500; letter-spacing: -.03em; text-decoration: none; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; word-break: break-all; }
.mail:hover { filter: brightness(1.2); }
.contact .hero-actions { justify-content: center; margin-top: 2rem; }

.foot { padding: 3rem 0 3.5rem; color: var(--text-3); font-size: .88rem; }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 2rem; }
.foot a { color: var(--text-2); text-decoration: none; }
.foot a:hover { color: var(--text); }
.foot-links { display: flex; gap: 1.4rem; }

/* ---------- Reveal on scroll ---------- */
@media (prefers-reduced-motion: no-preference) {
  .js .reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .js .reveal.in { opacity: 1; transform: none; }
  .js .hero .rise { opacity: 0; transform: translateY(22px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d, 0s); }
  @keyframes rise { to { opacity: 1; transform: none; } }
}

/* ---------- CV page ---------- */
.cv-page { padding: 8.5rem 0 3rem; }
.cv-page .wrap { max-width: 58rem; }
.cv-top { padding: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 1.2rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 1.5rem; }
.cv-top h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); letter-spacing: -.05em; line-height: 1; }
.cv-top p { color: var(--text-2); margin-top: .7rem; }
.cv-top .contact-line a { color: var(--text-2); text-underline-offset: 3px; text-decoration-color: rgba(139,108,255,.6); }
.cv-top .contact-line a:hover { color: var(--text); }
.cv-top .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
.cv-sec { padding: clamp(1.6rem, 3.5vw, 2.2rem); margin-bottom: 1.2rem; border-radius: var(--r-xl); background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); border: 1px solid var(--stroke); }
.cv-sec > h2 { font-size: 1.35rem; letter-spacing: -.03em; margin-bottom: 1.3rem; display: flex; align-items: center; gap: .7rem; }
.cv-sec > h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--grad); }
.cv-item { padding: 1.1rem 0; border-top: 1px solid var(--stroke); }
.cv-item:first-of-type { border-top: 0; padding-top: 0; }
.cv-item:last-child { padding-bottom: 0; }
.cv-row { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem 1.2rem; flex-wrap: wrap; }
.cv-row h3 { font-size: 1.06rem; letter-spacing: -.02em; }
.cv-row .date { font-size: .85rem; color: var(--text-3); white-space: nowrap; }
.cv-item .org { color: var(--text-3); font-size: .92rem; margin: .25rem 0 .5rem; }
.cv-item .org a { color: var(--text-2); text-underline-offset: 2px; text-decoration-color: rgba(139,108,255,.6); }
.cv-item ul, .cv-list { margin: .3rem 0 0; padding: 0; list-style: none; display: grid; gap: .45rem; }
.cv-item li, .cv-list li { position: relative; padding-left: 1.15rem; color: var(--text-2); font-size: .95rem; line-height: 1.55; }
.cv-item li::before, .cv-list li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }
.cv-dl { margin: 0; display: grid; grid-template-columns: 11rem 1fr; gap: .7rem 1.2rem; font-size: .95rem; }
.cv-dl dt { font-weight: 600; }
.cv-dl dd { margin: 0; color: var(--text-2); }

/* 404 */
.nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }
.nf h1 { font-size: clamp(5rem, 18vw, 11rem); line-height: .9; letter-spacing: -.06em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nf p { color: var(--text-2); margin: 1rem 0 2rem; }
.nf .hero-actions { justify-content: center; }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .t-now { grid-column: span 2; grid-row: auto; }
  .t-gpa, .t-jee { grid-column: span 1; }
  .t-amex, .t-int { grid-column: span 2; }
  .about-grid { grid-template-columns: 1fr; }
  .interests { position: static; grid-template-columns: 1fr 1fr; }
  .edu-main, .edu-side { grid-column: 1 / -1; }
  .edu-side { grid-template-columns: 1fr 1fr; }
  .skills { grid-template-columns: 1fr 1fr; }
  .skill.wide { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .nav { padding: .5rem .5rem .5rem 1rem; }
  .nav-links, .nav-cta { display: none; }
  .menu-btn {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1px solid var(--stroke); color: var(--text); cursor: pointer;
  }
  .menu-btn svg { width: 18px; height: 18px; }
  .nav.open { border-radius: 26px; flex-wrap: wrap; }
  .nav .brand { flex: 1; }
  .nav .menu-btn { order: 1; }
  .nav.open .nav-links { order: 2; }
  .nav.open .nav-cta { order: 3; }
  .nav.open .nav-links { display: flex; flex-direction: column; align-items: stretch; width: 100%; padding: .4rem 0 .3rem; }
  .nav.open .nav-links a { padding: .8rem .9rem; font-size: 1rem; }
  .nav.open .nav-cta { display: block; width: 100%; text-align: center; margin: 0 0 .3rem; }
}
@media (max-width: 680px) {
  .paper { grid-template-columns: 1fr; }
  .paper .links { grid-column: 1; grid-row: auto; margin-top: 1rem; }
  .findings { grid-template-columns: 1fr; }
  .tl-item { grid-template-columns: 1fr; gap: .5rem; }
  .tl-when { text-align: left; padding: 0 0 0 .3rem; }
  .tl-when:empty { display: none; }
  .interests, .edu-side, .honours, .skills { grid-template-columns: 1fr; }
  .bento { grid-template-columns: 1fr; }
  .t-now, .t-gpa, .t-jee, .t-amex, .t-int { grid-column: 1 / -1; }
  .hero { min-height: 0; padding-top: 7rem; }
  .skill.wide { grid-template-columns: 1fr; gap: .8rem; }
  .edu-stats { grid-template-columns: 1fr 1fr; gap: 1rem 1.5rem; }
  .cv-dl { grid-template-columns: 1fr; gap: 0; }
  .cv-dl dd { margin-bottom: .8rem; }
  .scroll-hint { display: none; }
}

/* ---------- Print (CV page): plain, light, compact ---------- */
@media print {
  html { font-size: 9.5pt; background: #fff !important; color-scheme: light; }
  body { background: #fff; color: #000; font-size: 1rem; line-height: 1.4; }
  .ambient, .nav, .foot, .no-print, .skip-link { display: none !important; }
  .reveal, .js .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  :root { --text: #000; --text-2: #333; --text-3: #555; --stroke: #ccc; --bg: #fff; color-scheme: light; }
  .cv-page { padding: 0; }
  .cv-page .wrap { max-width: none; padding: 0; }
  .glass, .cv-sec, .cv-top { background: none !important; border: 0 !important; border-radius: 0; backdrop-filter: none; padding: 0; margin: 0 0 8pt; box-shadow: none; }
  .glass::before, .glass::after { display: none; }
  .cv-top { border-bottom: 1px solid #ccc !important; padding-bottom: 8pt; }
  .cv-top h1 { color: #000; font-size: 2.3rem; }
  .cv-sec > h2 { font-size: 1.3rem; margin-bottom: 5pt; color: #000; }
  .cv-sec > h2::before { background: #6b4fe0; }
  .cv-item { padding: 5pt 0; break-inside: avoid; }
  .cv-item li::before, .cv-list li::before { background: #6b4fe0; }
  a { text-decoration: none; color: inherit; }
  @page { margin: 14mm; }
}

.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }

/* ---------- Hero orb (decorative) ---------- */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; gap: 2rem; }
.orb-wrap { position: relative; aspect-ratio: 1; width: 100%; max-width: 30rem; justify-self: end; }
.orb-ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(139,108,255,0) 0deg, rgba(139,108,255,.9) 90deg, rgba(79,140,255,.9) 160deg, rgba(47,214,195,.9) 230deg, rgba(47,214,195,0) 300deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
  filter: drop-shadow(0 0 12px rgba(139,108,255,.6));
}
.orb-ring.r2 { inset: 11%; opacity: .55; transform: rotate(140deg); }
.orb-ring.r3 { inset: 24%; opacity: .35; transform: rotate(250deg); }
.orb-core {
  position: absolute; inset: 31%; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0%, rgba(190,175,255,.55) 12%, transparent 38%),
    radial-gradient(circle at 70% 75%, rgba(47,214,195,.75) 0%, transparent 55%),
    radial-gradient(circle at 50% 50%, #5b46d6 0%, #2a1f7a 55%, #120e33 100%);
  box-shadow: 0 0 80px rgba(110,90,255,.55), 0 0 160px rgba(47,214,195,.25), inset -18px -24px 50px rgba(0,0,0,.45);
}
.orb-glow { position: absolute; inset: 15%; border-radius: 50%; background: radial-gradient(circle, rgba(110,90,255,.35), transparent 65%); filter: blur(30px); }
.float-chip {
  position: absolute; display: inline-flex; align-items: center; gap: .55rem; white-space: nowrap;
  padding: .6rem .95rem; border-radius: 16px; font-size: .86rem; font-weight: 500; color: var(--text);
  background: rgba(16, 16, 32, .78); border: 1px solid var(--stroke-strong);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
}
.float-chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.float-chip small { display: block; font-size: .74rem; color: var(--text-3); font-weight: 500; }
.fc1 { left: -6%; top: 16%; } .fc1 i { background: var(--violet); box-shadow: 0 0 10px var(--violet); }
.fc2 { right: -4%; top: 44%; } .fc2 i { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.fc3 { left: 8%; bottom: 8%; } .fc3 i { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
@media (prefers-reduced-motion: no-preference) {
  .orb-ring { animation: spin 18s linear infinite; }
  .orb-ring.r2 { animation: spin-r 26s linear infinite; }
  .orb-ring.r3 { animation: spin 34s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes spin-r { from { transform: rotate(360deg); } to { transform: rotate(0); } }
  .orb-core { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  .float-chip { animation: bob 7s ease-in-out infinite; }
  .fc2 { animation-delay: -2.3s; } .fc3 { animation-delay: -4.6s; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
}
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; }
  .orb-wrap { justify-self: center; max-width: 22rem; margin-top: 1rem; }
}
@media (max-width: 680px) {
  .hero h1 { font-size: clamp(3rem, 15vw, 4.4rem); }
  .orb-wrap { display: none; }
  .float-chip { font-size: .78rem; padding: .5rem .75rem; }
}

/* ---------- Photo spots (appear once assets/img/prof_pic.jpg exists) ---------- */
.orb-core { overflow: hidden; }
.orb-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; border-radius: 50%; }
.side-col { display: grid; gap: .8rem; position: sticky; top: 7rem; }
.side-col .interests { position: static; }
.photo-card { margin: 0; padding: .7rem; border-radius: var(--r-xl); }
.photo { position: relative; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, rgba(183,166,255,.5), transparent 45%), radial-gradient(circle at 75% 80%, rgba(47,214,195,.45), transparent 50%), linear-gradient(135deg, #2a1f7a, #0f1a3d); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.mono-big { font-family: var(--display); font-weight: 600; font-size: 3.4rem; letter-spacing: -.05em; color: rgba(255,255,255,.9); }
.photo-card figcaption { display: flex; flex-direction: column; padding: .9rem .6rem .35rem; }
.photo-card figcaption strong { font-family: var(--display); font-weight: 600; letter-spacing: -.02em; }
.photo-card figcaption span { color: var(--text-3); font-size: .88rem; }

/* ---------- Experience: two workstreams ---------- */
.workstreams { display: grid; gap: 1.2rem; margin-top: .4rem; }
.workstreams h4 { margin: 0 0 .55rem; font-family: var(--display); font-weight: 600; font-size: 1rem; letter-spacing: -.02em; color: var(--text); }
.workstreams > div { padding: 1.1rem 1.2rem; border-radius: var(--r-md); background: rgba(255,255,255,.03); border: 1px solid var(--stroke); }

/* ---------- Projects preview on home ---------- */
.proj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.proj { display: flex; flex-direction: column; padding: 1.7rem; text-decoration: none; min-height: 15rem; }
.proj:hover { transform: translateY(-3px); }
.proj-cat { font-size: .8rem; font-weight: 600; color: #b7a6ff; }
.proj h3 { font-size: 1.25rem; line-height: 1.2; letter-spacing: -.03em; margin: .7rem 0 .7rem; }
.proj p { color: var(--text-2); font-size: .95rem; line-height: 1.55; margin-top: auto; }

/* ---------- Projects page ---------- */
.page-head { padding: 9rem 0 1rem; }
.page-head h1 { font-size: clamp(3rem, 8vw, 6rem); line-height: .95; letter-spacing: -.055em;
  background: linear-gradient(100deg, #ffffff 20%, #b7a6ff 60%, #6ef0df 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .05em; }
.page-head p { color: var(--text-2); max-width: 38rem; margin: 1rem 0 2rem; font-size: 1.08rem; }
.pj-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
.pj { padding: 1.8rem 1.9rem; scroll-margin-top: 7rem; }
.pj[hidden] { display: none; }
.pj:target { border-color: rgba(139,108,255,.7); box-shadow: 0 0 0 1px rgba(139,108,255,.5), 0 0 40px rgba(139,108,255,.25); }
.pj-top { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; font-size: .84rem; color: var(--text-3); margin-bottom: .9rem; }
.pj-cat { font-weight: 600; color: #b7a6ff; }
.pj[data-kind="industry"] .pj-cat { color: #6ef0df; }
.pj[data-kind="course"] .pj-cat { color: #8fb6ff; }
.pj[data-kind="other"] .pj-cat { color: #ff9cc8; }
.pj h2 { font-size: 1.35rem; line-height: 1.2; letter-spacing: -.03em; }
.pj h2 a { text-decoration: none; background-image: linear-gradient(currentColor, currentColor); background-size: 0 1px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .3s ease; }
.pj h2 a:hover { background-size: 100% 1px; }
.pj-who { color: var(--text-3); font-size: .9rem; margin-top: .45rem; }
.pj-desc { color: var(--text-2); margin-top: .9rem; font-size: .98rem; }
.pj details { margin-top: 1.1rem; border-top: 1px solid var(--stroke); }
.pj summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; font-weight: 600; font-size: .9rem; }
.pj summary::-webkit-details-marker { display: none; }
.pj summary .plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--stroke-strong); display: grid; place-items: center; transition: transform .25s ease; }
.pj details[open] summary .plus { transform: rotate(45deg); }
.pj details ul { margin: .9rem 0 0; padding: 0; list-style: none; display: grid; gap: .55rem; }
.pj details li { position: relative; padding-left: 1.15rem; color: var(--text-2); font-size: .93rem; line-height: 1.55; }
.pj details li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); }
.pj-tools { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: 1.1rem; }
.pj-tools span { font-size: .78rem; font-weight: 500; color: var(--text-2); padding: .25rem .6rem; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); }
.pj .links { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }

/* ---------- CV: two columns ---------- */
.cv-page .wrap { max-width: var(--wrap); }
.cv-id { display: flex; align-items: center; gap: 1.4rem; }
.cv-photo { position: relative; flex: none; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: var(--grad); color: #0a0a14; font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.03em; box-shadow: 0 0 40px rgba(139,108,255,.35); }
.cv.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.cv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1.2rem; align-items: start; }
.cv-col { display: grid; gap: 1.2rem; }
.cv-col .cv-sec { margin: 0; }
.cv-left .cv-sec { padding: 1.5rem 1.5rem; }
.cv-left h3 { font-size: .98rem; letter-spacing: -.015em; }
.cv-left .org { font-size: .88rem; margin: .2rem 0 .35rem; }
.kv { display: flex; justify-content: space-between; gap: 1rem; font-size: .84rem; color: var(--text-2); margin: 0; }
.kv span:last-child { font-weight: 600; color: var(--text); }
.cv-left .cv-item { padding: .9rem 0; }
.cv-left .cv-list li { font-size: .9rem; }
.cv-sub { margin: 1rem 0 .5rem; font-size: .8rem; font-weight: 600; color: var(--text-3); }
.cv-sec h2 + .cv-sub { margin-top: 0; }
.tags.sm .tag { font-size: .8rem; padding: .28rem .62rem; }
.cv-p { color: var(--text-2); font-size: .9rem; line-height: 1.55; }
